<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Zilbershlag wax seal">
  <defs>
    <radialGradient id="wax" cx="40%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#b5434f"/>
      <stop offset="46%" stop-color="#8b2733"/>
      <stop offset="100%" stop-color="#571620"/>
    </radialGradient>
    <radialGradient id="sheen" cx="38%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="3" flood-color="#320a10" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- wax blob (slightly irregular, as pressed wax spreads) -->
  <path filter="url(#drop)" fill="url(#wax)" d="M111,59
    C112,74 104,96 84,106
    C64,116 34,112 19,97
    C6,84 6,52 16,35
    C27,16 55,7 76,13
    C97,19 110,38 111,59 Z"/>

  <!-- soft top-left sheen -->
  <ellipse cx="47" cy="41" rx="31" ry="23" fill="url(#sheen)"/>

  <!-- pressed die edge (debossed ring) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#4a121b" stroke-width="2" opacity=".55"/>
  <circle cx="60" cy="59" r="42" fill="none" stroke="#d98a92" stroke-width=".7" opacity=".35"/>

  <!-- dotted inner ring -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="#3f0e17" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="0.1 6.1" opacity=".5"/>

  <!-- embossed Z monogram: recessed shadow + raised face -->
  <text x="60" y="79" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-weight="700" font-size="54" fill="#490f18" opacity=".6">Z</text>
  <text x="60" y="77.6" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-weight="700" font-size="54" fill="#bd505a">Z</text>
</svg>
